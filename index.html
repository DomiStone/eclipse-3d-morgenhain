<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b36"><title>ECLIPSE 3D – Morgenhain</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111d28;color:#f4eedb;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(17px,3vw,26px);margin:6px 0 12px}#game{position:relative;aspect-ratio:16/9;border:3px solid #7b7165;border-radius:15px;overflow:hidden;background:#7ca7c6;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:8px;left:9px;color:white;text-shadow:0 2px 5px black;font-weight:700;font-size:clamp(10px,1.7vw,15px);pointer-events:none}#msg{position:absolute;top:10px;left:25%;width:50%;text-align:center;color:white;text-shadow:0 2px 5px black;font-size:clamp(10px,1.5vw,14px);pointer-events:none}#joy{position:absolute;left:12px;bottom:12px;width:clamp(84px,16vw,122px);aspect-ratio:1;border-radius:50%;border:2px solid #fff9;background:#182f4888;touch-action:none}#knob{position:absolute;left:30%;top:30%;width:40%;height:40%;border-radius:50%;background:#b9d6ec;border:2px solid white;pointer-events:none}#actions{position:absolute;right:10px;bottom:10px;display:grid;grid-template-columns:repeat(2,clamp(43px,8vw,61px));gap:6px}#actions button{aspect-ratio:1;border-radius:50%;border:2px solid #fffd;font-size:22px;color:white;touch-action:none;cursor:pointer}button{cursor:pointer}#reset{background:#344a5c;color:white;border:1px solid #8a9fac;border-radius:8px;padding:8px}#quest{background:#233443;border:1px solid #43596a;border-radius:9px;padding:12px;margin-top:10px}small{color:#bdc9d2}#help{line-height:1.5}
</style></head><body><main><header><h1>⚔️ ECLIPSE 3D – Morgenhain</h1><button id="reset">↻ Neustart</button></header><div id="game"><canvas id="view" width="960" height="540"></canvas><div id="hud"></div><div id="msg"></div><div id="joy"><div id="knob"></div></div><div id="actions"><button id="magic" style="background:#6b54b8" aria-label="Magie">✨</button><button id="attack" style="background:#b44345" aria-label="Angriff">⚔️</button><button id="heal" style="background:#aa8231" aria-label="Heilen">🧪</button><button id="talk" style="background:#397b60" aria-label="Interagieren">💬</button></div></div><section id="quest"></section><p id="help"><small>🕹️ Joystick links · ⚔️ Angriff · ✨ Magie · 🧪 Heiltrank · 💬 Sprechen / Kaufen / Truhe öffnen · Kamera mit Finger drehen · Tastatur: WASD, Leertaste, R, H, F. Der Spielstand wird automatisch gespeichert.</small></p></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('view'),g=cv.getContext('2d');let keys={},joy={x:0,y:0},cam=0,drag=null,slash=0,spell=0,hitDelay=0,msgTime=0,gate=0,last=0,clock=8;
const villagers=[['Mira',0,10,'#9d79b6'],['Borin',-7,15,'#a78a67'],['Lysa',7,3,'#d5ad67'],['Elara',-6,4,'#ca8976'],['Rurik',2,-18,'#7897bc'],['Sven',-17,0,'#7897bc'],['Finn',4,-4,'#d6b365'],['Mila',-4,-4,'#d67a96'],['Theo',4,7,'#6eafbf'],['Ida',-4,7,'#cfbd79'],['Tarek',17,-15,'#9ca867'],['Hilda',-17,-15,'#b2aa68']];
const houses=[[-13,-12,9,8], [13,-12,10,8],[-13,11,10,9],[13,11,9,9],[0,17,10,8]];
let p,npcs,enemies,chests,quest,wolves,bossDead;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),d=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
function note(t){$('msg').textContent=t;msgTime=4}
function init(load=true){let data=null;try{if(load)data=JSON.parse(localStorage.getItem('morgenhain-v2'))}catch(e){}p=data?.p||{x:0,z:-9,hp:100,gold:40,potions:3,power:0,level:1,xp:0};quest=data?.quest||0;wolves=data?.wolves||0;bossDead=data?.bossDead||false;clock=data?.clock||8;cam=0;gate=0;enemies=data?.enemies||Array.from({length:13},(_,i)=>{let a=i*.55+2,r=39+(i%3)*6;return{x:Math.sin(a)*r,z:Math.cos(a)*r,hp:6,type:'wolf',phase:i}});if(!bossDead&&!enemies.some(e=>e.type==='boss'))enemies.push({x:0,z:-70,hp:36,type:'boss',phase:0});chests=data?.chests||[{x:13,z:-44,open:false},{x:-16,z:-49,open:false}];npcs=villagers.map((v,i)=>({name:v[0],x:v[1],z:v[2],homeX:v[1],homeZ:v[2],color:v[3],phase:i*1.7}));note('🏰 Willkommen in Morgenhain!');hud()}
function save(){try{localStorage.setItem('morgenhain-v2',JSON.stringify({p,quest,wolves,bossDead,clock,enemies,chests}))}catch(e){}}
function hud(){ $('hud').textContent='❤️ '+Math.ceil(p.hp)+'/100 · ⭐ '+p.level+' · 🪙 '+p.gold+' · 🧪 '+p.potions+' · ⚔️ +'+p.power;$('quest').innerHTML='<strong>'+['📜 Sprich mit Mira','🐺 Besiege 3 Schattenwölfe ('+Math.min(wolves,3)+'/3)','🏰 Berichte Mira','👹 Besiege den Schattenwächter','🏆 Morgenhain ist gerettet!'][quest]+'</strong><br><small>XP '+p.xp+'/'+(p.level*30)+' · '+(quest===0?'Mira steht nördlich des Brunnens.':quest===1?'Verlasse das Dorf durch das südliche Tor.':quest===2?'Kehre zu Mira zurück.':quest===3?'Der Boss wartet weit südlich des Dorfes.':'Erkunde die Wildnis und verbessere deine Ausrüstung.')+'</small>'}
function collision(x,z){let r=Math.max(Math.abs(x),Math.abs(z));if(r>22.5&&r<33&&!(Math.abs(x)<3.6&&z< -22&&z> -34&&gate>.7))return true;for(let h of houses)if(Math.abs(x-h[0])<h[2]/2+1&&Math.abs(z-h[1])<h[3]/2+1)return true;return Math.hypot(x,z)<3.3}
function gain(n){p.xp+=n;while(p.xp>=p.level*30){p.xp-=p.level*30;p.level++;p.power++;p.hp=Math.min(100,p.hp+30);note('⭐ Stufenaufstieg! Schwert stärker!')}}
function kill(i){let e=enemies[i];if(e.type==='boss'){bossDead=true;p.gold+=100;gain(80);if(quest===3)quest=4;note('🏆 Schattenwächter besiegt! +100 Gold')}else{wolves++;p.gold+=12;gain(12);if(quest===1&&wolves>=3){quest=2;note('📜 Quest erfüllt! Kehre zu Mira zurück.')}else note('🐺 Wolf besiegt! +12 Gold, +12 XP')}enemies.splice(i,1);hud();save()}
function attack(){if(slash>0||p.hp<=0)return;slash=.35;let count=0;for(let i=enemies.length-1;i>=0;i--){let e=enemies[i],dd=d(p,e),angle=Math.atan2(e.x-p.x,e.z-p.z),diff=Math.atan2(Math.sin(angle-p.a),Math.cos(angle-p.a));if(dd<(e.type==='boss'?6.2:5.2)&&Math.abs(diff)<1.45){e.hp-=3+p.power;count++;if(e.hp<=0)kill(i)}}if(!count)note('⚔️ Kein Gegner in Reichweite');else note('⚔️ Treffer!');hud()}
function magic(){if(spell>0||p.hp<=0)return;spell=.7;let count=0;for(let i=enemies.length-1;i>=0;i--)if(d(p,enemies[i])<9){enemies[i].hp-=4+p.level;count++;if(enemies[i].hp<=0)kill(i)}note(count?'✨ Magie trifft '+count+' Gegner!':'✨ Magiewelle!');hud()}
function heal(){if(p.hp>=100)return note('❤️ Du bist bereits gesund.');if(p.potions<=0)return note('🧪 Keine Tränke! Besuche Lysa.');p.potions--;p.hp=Math.min(100,p.hp+45);note('🧪 +45 Leben');hud();save()}
function talk(){for(let c of chests)if(!c.open&&d(p,c)<4){c.open=true;p.gold+=30;p.potions++;note('📦 Truhe: +30 Gold und Heiltrank!');hud();save();return}if(Math.hypot(p.x,p.z)<4.6){p.hp=100;note('💧 Brunnen heilt dich vollständig!');hud();return}let n=npcs.filter(n=>d(n,p)<5.5).sort((a,b)=>d(a,p)-d(b,p))[0];if(!n)return note('💬 Geh näher zu einer Person.');if(n.name==='Mira'){if(quest===0){quest=1;note('📜 Mira: Besiege drei Schattenwölfe!')}else if(quest===2){quest=3;p.gold+=40;p.potions+=2;note('📜 Mira: Besiege den Schattenwächter! +40 Gold, +2 Tränke')}else note('💬 Mira: Beschütze Morgenhain!')}else if(n.name==='Borin'){if(p.gold>=25){p.gold-=25;p.power++;note('🔨 Schwert verbessert!')}else note('🔨 Verbesserung kostet 25 Gold')}else if(n.name==='Lysa'){if(p.gold>=12){p.gold-=12;p.potions++;note('🧪 Trank gekauft!')}else note('🛒 Heiltrank kostet 12 Gold')}else note('💬 '+n.name+': Sei gegrüßt, Held!');hud();save()}
function project(x,y,z){let dx=x-p.x,dz=z-p.z,s=Math.sin(cam),c=Math.cos(cam),rx=dx*c-dz*s,rz=dx*s+dz*c;let depth=rz+14,scale=550/(depth+10);return{x:480+rx*scale,y:320+(depth-14)*7-y*scale,scale,depth}}
function rect(x,y,z,w,h,depth,color){let q=project(x,y,z);if(q.depth< -7)return;g.fillStyle=color;let sw=Math.max(1,w*q.scale),sh=Math.max(1,h*q.scale);g.fillRect(q.x-sw/2,q.y-sh,sw,sh);if(depth){g.fillStyle='#0002';g.fillRect(q.x-sw/2,q.y-sh,Math.max(2,depth*q.scale*.2),sh)}}
function entity(x,z,color,scale=1){rect(x,.15,z,.85*scale,1.6*scale,.5,color);rect(x,1.85*scale,z,.65*scale,.62*scale,.5,'#e6bfa3');rect(x,2.5*scale,z,.72*scale,.18*scale,.5,'#56473c')}
function render(){g.clearRect(0,0,960,540);let night=clock>20||clock<6;g.fillStyle=night?'#253a53':'#8cbad8';g.fillRect(0,0,960,540);g.fillStyle=night?'#344f4b':'#6e9c66';g.fillRect(0,320,960,220);let shapes=[];function add(x,z,fn){let q=project(x,0,z);if(q.depth> -8&&q.depth<180)shapes.push({depth:q.depth,fn})}
for(let x=-105;x<=105;x+=7)for(let z=-105;z<=105;z+=7){if(Math.abs(x)<35&&Math.abs(z)<35)continue;let seed=Math.abs(Math.sin(x*12.9898+z*78.233));if(seed>.79)add(x,z,()=>{rect(x,0,z,.55,3,0,'#6d523b');rect(x,3,z,3.8,4,0,'#35784f')})}
for(let h of houses)add(h[0],h[1],()=>{rect(h[0],0,h[1],h[2],6,0,'#c9b198');rect(h[0],6,h[1],h[2]+1,2.1,0,'#87554b');rect(h[0],0,h[1]-h[3]/2,1.6,2.8,0,'#644735')});
for(let t of [-25,25])for(let v of [-25,25])add(t,v,()=>rect(t,0,v,5,10,0,'#a9aaa4'));
for(let i=-22;i<=22;i+=5)for(let side of [-1,1]){add(side*25,i,()=>rect(side*25,0,i,2.2,7.5,0,'#aaa9a0'));if(!(side===-1&&Math.abs(i)<5))add(i,side*25,()=>rect(i,0,side*25,4,7.5,0,'#aaa9a0'))}
add(0,-25,()=>{if(gate<1)rect(0,gate*7,-25,7,7*(1-gate),0,'#79583b')});
add(0,0,()=>{rect(0,0,0,4.5,1.4,0,'#a9ada7');rect(0,1.4,0,3.5,.15,0,'#4da4c2')});
for(let c of chests)add(c.x,c.z,()=>rect(c.x,0,c.z,2,1.2,0,c.open?'#655849':'#b78c45'));
for(let n of npcs)add(n.x,n.z,()=>entity(n.x,n.z,n.color,n.name==='Finn'||n.name==='Mila'||n.name==='Theo'||n.name==='Ida'?.72:1));
for(let e of enemies)add(e.x,e.z,()=>{let boss=e.type==='boss';rect(e.x,0,e.z,boss?3.4:1.7,boss?5:1.7,0,boss?'#594366':'#5a5663');rect(e.x,boss?5:1.7,e.z,boss?2:1.1,boss?1.2:.8,0,boss?'#80648f':'#776d7b');if(d(p,e)<15){let q=project(e.x,boss?7:3,e.z);g.fillStyle='#310e19';g.fillRect(q.x-18,q.y-10,36,5);g.fillStyle='#eb6969';g.fillRect(q.x-18,q.y-10,36*e.hp/(boss?36:6),5)}});
shapes.sort((a,b)=>b.depth-a.depth);for(let s of shapes)s.fn();
g.save();g.translate(480,380);let step=Math.sin(performance.now()/100)*3;g.fillStyle='#26394d';g.fillRect(-16,30+step,13,37);g.fillRect(4,30-step,13,37);g.fillStyle='#c0d0de';g.fillRect(-27,-37,54,70);g.fillStyle='#a34d5a';g.fillRect(-23,-25,46,15);g.fillStyle='#e3e9ee';g.fillRect(-20,-70,40,37);g.fillStyle='#52667c';g.fillRect(-15,-49,30,7);g.fillStyle='#b7c6d4';g.fillRect(-39,-29,14,52);g.fillRect(25,-29,14,52);g.fillStyle=slash>0?'#fff3a9':'#e1eaf2';g.fillRect(38,-85,7,slash>0?92:76);g.fillStyle='#c6a461';g.fillRect(28,-10,27,6);if(spell>0){g.strokeStyle='#a7b3ff';g.lineWidth=5;g.beginPath();g.arc(0,20,(1-spell/.7)*240,0,Math.PI*2);g.stroke()}g.restore();
if(night){g.fillStyle='#0b133225';g.fillRect(0,0,960,540)}}
function update(ms){let dt=Math.min((ms-last)/1000||.016,.05);last=ms;clock=(clock+dt*.15)%24;let ix=joy.x+(keys.d?1:0)-(keys.a?1:0),iy=joy.y+(keys.s?1:0)-(keys.w?1:0),mag=Math.hypot(ix,iy);if(mag>1){ix/=mag;iy/=mag;mag=1}gate=clamp(gate+((Math.abs(p.x)<7&&Math.abs(p.z+25)<12)?1:-1)*dt*1.8,0,1);if(mag>.1&&p.hp>0){let vx=Math.sin(cam)*(-iy)+Math.cos(cam)*ix,vz=Math.cos(cam)*(-iy)-Math.sin(cam)*ix,s=dt*8*mag;if(!collision(p.x+vx*s,p.z))p.x+=vx*s;if(!collision(p.x,p.z+vz*s))p.z+=vz*s;p.a=Math.atan2(vx,vz)}
slash=Math.max(0,slash-dt);spell=Math.max(0,spell-dt);hitDelay=Math.max(0,hitDelay-dt);msgTime-=dt;
for(let n of npcs){n.phase+=dt;let tx=n.homeX+Math.sin(n.phase*.35+n.homeX)*2,tz=n.homeZ+Math.cos(n.phase*.27+n.homeZ)*2;if(!collision(tx,tz)){n.x+=(tx-n.x)*dt*.4;n.z+=(tz-n.z)*dt*.4}}
for(let e of enemies){e.phase+=dt;let dd=d(p,e);if(dd<18&&dd>2.2&&p.hp>0){let nx=e.x+(p.x-e.x)/dd*dt*(e.type==='boss'?1.2:2),nz=e.z+(p.z-e.z)/dd*dt*(e.type==='boss'?1.2:2);if(Math.max(Math.abs(nx),Math.abs(nz))>34){e.x=nx;e.z=nz}}if(dd<(e.type==='boss'?3.3:2.1)&&hitDelay<=0&&p.hp>0){p.hp=Math.max(0,p.hp-(e.type==='boss'?20:9));hitDelay=1.1;note(p.hp?'💥 Monsterangriff!':'💀 Du bist besiegt. Drücke Neustart.');hud()}}
if(msgTime<=0)$('msg').textContent=clock>20||clock<6?'🌙 Nacht in Morgenhain':'☀️ Morgenhain – '+enemies.length+' Gegner';render();requestAnimationFrame(update)}
let sid=null,stick=$('joy'),knob=$('knob');function setStick(e){let r=stick.getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2,max=r.width*.3,m=Math.hypot(x,y);if(m>max){x*=max/m;y*=max/m}joy={x:x/max,y:y/max};knob.style.transform='translate('+x+'px,'+y+'px)'}
stick.addEventListener('pointerdown',e=>{e.preventDefault();sid=e.pointerId;stick.setPointerCapture(sid);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)setStick(e)});function release(){sid=null;joy={x:0,y:0};knob.style.transform=''}for(let ev of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(ev,release);
cv.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX};cv.setPointerCapture(e.pointerId)});cv.addEventListener('pointermove',e=>{if(drag?.id===e.pointerId){cam+=(e.clientX-drag.x)*.008;drag.x=e.clientX}});for(let ev of ['pointerup','pointercancel'])cv.addEventListener(ev,()=>drag=null);
const map={w:'w',ArrowUp:'w',s:'s',ArrowDown:'s',a:'a',ArrowLeft:'a',d:'d',ArrowRight:'d'};window.addEventListener('keydown',e=>{if(map[e.key]){keys[map[e.key]]=true;e.preventDefault()}if(e.repeat)return;if(e.code==='Space'){attack();e.preventDefault()}if(e.key==='r')magic();if(e.key==='h')heal();if(e.key==='f')talk()});window.addEventListener('keyup',e=>{if(map[e.key])keys[map[e.key]]=false});$('attack').onclick=attack;$('magic').onclick=magic;$('heal').onclick=heal;$('talk').onclick=talk;$('reset').onclick=()=>{if(confirm('Neues Spiel starten?')){localStorage.removeItem('morgenhain-v2');init(false)}};setInterval(save,8000);window.addEventListener('pagehide',save);init();requestAnimationFrame(update);
})();
</script></body></html>
